[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop client — Tauri shell over the dsh web host"
authors = ["dsh-desktop contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to 2.4.3 per the dsh-nbe spec: the version with full macOS support
# (unix-socket identity). It pulls tauri ^2.10, so tauri is bumped to match.
tauri = { version = "2.10", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "=2.4.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
