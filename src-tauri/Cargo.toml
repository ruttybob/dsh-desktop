[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop client — Tauri shell over the dsh web host"
authors = ["dsh-desktop contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
log = "0.4"
dirs = "6"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
