<!doctype html>
<!-- Unreachable-server stub (Attach Mode, ticket dsh-cxq; mirrors the
     approved prototype docs/prototypes/attach-splash-prototype.html,
     unreachable screen). The window is pointed here by the Rust probe
     (src-tauri/src/stub.rs) when the attached server stops answering —
     Tauri/wry does not report navigation failures, so this polling is the
     only detector. Retry/Quit/diagnostics go through the stub_* Tauri
     commands; the page itself decides nothing. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness Desktop — Server unreachable</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: #14161a; color: #d7dae0; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        user-select: none;
      }
      kbd {
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
        background: #23262d; border: 1px solid #33363f; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; color: #a9aeb8;
      }
      .stub-card { width: 480px; display: flex; flex-direction: column; gap: 16px; }
      .stub-head { display: flex; align-items: center; gap: 14px; }
      .stub-icon {
        width: 46px; height: 46px; border-radius: 12px; flex: none;
        background: #3a2620; color: #e8a87c; font-size: 22px;
        display: flex; align-items: center; justify-content: center;
      }
      .stub-head h1 { font-size: 16px; font-weight: 600; }
      .stub-head .sub { font-size: 12px; color: #6b7078; margin-top: 3px; }
      .diag {
        background: #1b1e24; border: 1px solid #2e323b; border-radius: 8px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px;
        padding: 12px 14px; color: #a9aeb8; line-height: 1.7;
      }
      .diag .k { color: #6b7078; }
      .diag .bad { color: #e8a87c; }
      .diag .ok { color: #93c39a; }
      .stub-actions { display: flex; gap: 10px; }
      .btn {
        flex: 1; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600;
        padding: 11px; cursor: pointer;
      }
      .btn-retry { background: #3565a4; color: #eaf2fc; border: none; }
      .btn-retry:hover { background: #3f74b8; }
      .btn-retry:disabled { opacity: 0.5; cursor: default; }
      .btn-quit { background: transparent; color: #a9aeb8; border: 1px solid #33363f; }
      .btn-quit:hover { color: #d7dae0; border-color: #4a4e58; }
      .stub-foot { font-size: 11px; color: #5c616b; text-align: center; }
    </style>
  </head>
  <body>
    <div class="stub-card">
      <div class="stub-head">
        <div class="stub-icon">⚡</div>
        <div>
          <h1>Server is not reachable</h1>
          <div class="sub">The attached server did not respond</div>
        </div>
      </div>
      <div class="diag" id="diag"></div>
      <div class="stub-actions">
        <button class="btn btn-retry" id="retryBtn">Retry</button>
        <button class="btn btn-quit" id="quitBtn">Quit</button>
      </div>
      <div class="stub-foot" id="foot">
        Retry navigates back to the server when it comes up · Quit closes the app
      </div>
    </div>
    <script>
      const diag = document.getElementById('diag');
      const retryBtn = document.getElementById('retryBtn');
      const quitBtn = document.getElementById('quitBtn');
      const foot = document.getElementById('foot');

      // withGlobalTauri exposes the IPC bridge; without it the stub degrades
      // to a visible message instead of failing silently.
      function invoke(method, args) {
        const tauri = window.__TAURI__;
        if (!tauri) { throw new Error('Tauri IPC unavailable'); }
        return tauri.core.invoke(method, args);
      }

      // One line of the mono diagnostics block: "key    value". Built with
      // DOM APIs + textContent only — verdict and url come from the probed
      // server (attacker-controlled), so no dynamic value may pass through
      // innerHTML (review fix: XSS/HTML injection).
      function row(key, value, valueClass) {
        const line = document.createElement('div');
        const k = document.createElement('span');
        k.className = 'k';
        k.textContent = key.padEnd(9);
        line.appendChild(k);
        if (valueClass) {
          const v = document.createElement('span');
          v.className = valueClass;
          v.textContent = value;
          line.appendChild(v);
        } else {
          line.appendChild(document.createTextNode(value));
        }
        return line;
      }

      // Static trusted fragment (contains <kbd> markup) appended as HTML.
      function appendStaticHint(line, text) {
        const v = document.createElement('span');
        v.innerHTML = text; // static string only — never dynamic values
        line.appendChild(v);
      }

      function render(data) {
        diag.replaceChildren();
        if (!data) {
          diag.replaceChildren(row('status', 'no monitored server', 'bad'));
          return;
        }
        const verdictClass = data.verdict.startsWith('alive') ? 'ok' : 'bad';
        const retry = data.attempt > 0
          ? 'attempt ' + data.attempt + ', next probe in ' + Math.round(data.next_retry_ms / 1000) + 's'
          : 'attempt 0';
        diag.appendChild(row('url', data.url));
        diag.appendChild(row('probe', data.verdict, verdictClass));
        diag.appendChild(row('retry', retry));
        const hintLine = row('hint', '');
        const hint = hintLine.lastChild;
        if (data.non_loopback) {
          hint.append('non-loopback host — server needs ');
          const kbd = document.createElement('kbd');
          kbd.textContent = '--trusted-host';
          hint.append(kbd);
        } else {
          hint.textContent = 'loopback host — no --trusted-host required';
        }
        diag.appendChild(hintLine);
      }

      async function refresh() {
        try {
          render(await invoke('stub_diagnostics'));
        } catch (error) {
          diag.replaceChildren(row('status', String(error), 'bad'));
        }
      }

      retryBtn.addEventListener('click', async () => {
        retryBtn.disabled = true;
        foot.textContent = 'Probing…';
        try {
          const alive = await invoke('stub_retry');
          // On success the host navigates the window back to the server;
          // on failure the diagnostics poll below keeps the counters moving.
          if (!alive) foot.textContent = 'Still not reachable — waiting for the server…';
        } catch (error) {
          foot.textContent = String(error);
        } finally {
          retryBtn.disabled = false;
          refresh();
        }
      });

      quitBtn.addEventListener('click', async () => {
        quitBtn.disabled = true;
        try { await invoke('stub_quit'); } catch (error) { foot.textContent = String(error); }
      });

      refresh();
      // The poll loop lives in Rust; this only refreshes the live view so the
      // attempt counter and backoff step keep growing while the stub shows.
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
