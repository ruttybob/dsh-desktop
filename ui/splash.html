<!doctype html>
<!-- Splash connect form (Attach Mode, ticket dsh-df4; mirrors the approved
     prototype docs/prototypes/attach-splash-prototype.html, connect screen).
     The window is pointed here by the launch resolver when a launch carries
     no attach signal and no remembered server. All behavior goes through the
     splash_* Tauri commands in src-tauri/src/splash.rs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness Desktop — Connect</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: #14161a; color: #d7dae0; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        user-select: none;
      }
      kbd {
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
        background: #23262d; border: 1px solid #33363f; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; color: #a9aeb8;
      }
      .splash-logo {
        width: 72px; height: 72px; border-radius: 18px; margin-bottom: 22px;
        background: linear-gradient(135deg, #2c4a6e, #4a3a6e);
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; color: #cfe0f5;
      }
      .splash-card { width: 420px; display: flex; flex-direction: column; gap: 14px; }
      .splash-card h1 { font-size: 18px; font-weight: 600; text-align: center; }
      .splash-card .sub { font-size: 12px; color: #6b7078; text-align: center; margin-top: -8px; }
      .mode-pill {
        align-self: center; font-size: 11px; color: #93c39a; background: #1e2a22;
        border: 1px solid #334136; border-radius: 999px; padding: 3px 10px;
      }
      .field label { display: block; font-size: 11px; color: #6b7078; margin-bottom: 6px; }
      .field input {
        width: 100%; background: #1b1e24; border: 1px solid #2e323b; border-radius: 8px;
        color: #d7dae0; font: inherit; font-size: 13px; padding: 10px 12px; outline: none;
      }
      .field input:focus { border-color: #4a6e8f; }
      .field .hint { font-size: 11px; color: #5c616b; margin-top: 6px; display: none; }
      .field .hint.visible { display: block; }
      .remember {
        display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a9aeb8;
        cursor: pointer; user-select: none;
      }
      .btn-connect {
        background: #3565a4; color: #eaf2fc; border: none; border-radius: 8px;
        font: inherit; font-size: 13px; font-weight: 600; padding: 11px; cursor: pointer;
      }
      .btn-connect:hover { background: #3f74b8; }
      .btn-connect:disabled { opacity: 0.5; cursor: default; }
      .connecting-note {
        font-size: 12px; color: #8ab4f0; text-align: center; min-height: 16px;
      }
      .connecting-note.error { color: #e8a87c; }
    </style>
  </head>
  <body>
    <div class="splash-logo">◈</div>
    <div class="splash-card">
      <h1>Connect to a server</h1>
      <div class="sub">Attach this window to a running DSH server</div>
      <div class="mode-pill">Attach Mode</div>
      <div class="field">
        <label for="urlInput">Server URL</label>
        <input id="urlInput" placeholder="http://127.0.0.1:3080" spellcheck="false" autofocus />
        <div class="hint" id="trustedHostHint">
          Non-loopback hosts require <kbd>--trusted-host</kbd> on the server
        </div>
      </div>
      <label class="remember">
        <input type="checkbox" id="rememberChk" />
        Remember this server and connect automatically
      </label>
      <button class="btn-connect" id="connectBtn">Connect</button>
      <div class="connecting-note" id="note"></div>
    </div>
    <script>
      const urlInput = document.getElementById('urlInput');
      const rememberChk = document.getElementById('rememberChk');
      const connectBtn = document.getElementById('connectBtn');
      const note = document.getElementById('note');
      const hint = document.getElementById('trustedHostHint');

      // The hint only makes sense when the server would run without the
      // launch-token trust of loopback: anything but localhost/127/::1.
      function isLoopback(value) {
        try {
          const url = new URL(value.trim());
          const host = url.hostname;
          return host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1';
        } catch {
          return true; // not a URL yet — keep the hint out of the way
        }
      }
      function refreshHint() {
        const value = urlInput.value.trim();
        hint.classList.toggle('visible', value !== '' && !isLoopback(value));
      }
      urlInput.addEventListener('input', () => { refreshHint(); note.textContent = ''; });

      async function invoke(method, args) {
        // withGlobalTauri exposes the IPC bridge; without it (e.g. page opened
        // outside the Tauri window) the form degrades to a visible message.
        const tauri = window.__TAURI__;
        if (!tauri) { throw new Error('Tauri IPC unavailable'); }
        return tauri.core.invoke(method, args);
      }

      connectBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) { urlInput.focus(); return; }
        connectBtn.disabled = true;
        note.classList.remove('error');
        note.textContent = 'Connecting…';
        try {
          await invoke('splash_connect', { url, remember: rememberChk.checked });
          // Navigation happens host-side; nothing to do here.
        } catch (error) {
          note.classList.add('error');
          note.textContent = String(error);
          connectBtn.disabled = false;
        }
      });
      urlInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') connectBtn.click();
      });

      // Prefill from the shell-owned remember store (last choice convenience;
      // auto-connect for a remembered launch is the resolver's job).
      invoke('splash_get_remembered')
        .then((remembered) => {
          if (remembered) {
            urlInput.value = remembered;
            refreshHint();
          }
        })
        .catch(() => {
          note.classList.add('error');
          note.textContent = 'Tauri IPC unavailable — connect form is inert.';
        });
    </script>
  </body>
</html>
